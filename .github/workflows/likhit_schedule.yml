name: Likhit Jap Daily 108 Challenge Reel Engine

on:
  schedule:
    # 06:00 AM IST daily (00:30 AM UTC) - Prime morning devotional peak
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Target Challenge Day (1-108, leave blank for auto-increment)'
        required: false
        default: ''

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-deva

      - name: Install Dependencies
        run: npm install

      - name: Build Daily Challenge Reel
        env:
          TARGET_DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "$TARGET_DAY" ]; then
            node scripts/build_challenge_reel.js --day "$TARGET_DAY"
          else
            node scripts/build_challenge_reel.js
          fi

      - name: Syndicate to Platforms (Facebook, Instagram, YouTube)
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TARGET_DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "$TARGET_DAY" ]; then
            node scripts/post_challenge_reel.js --day "$TARGET_DAY"
          else
            node scripts/post_challenge_reel.js
          fi

      - name: Commit Updated Progress State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-progress: Likhit Jap Day advanced [skip ci]" && git push)
